name: Build Reach News

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android Compose APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle wrapper --gradle-version 8.11.1
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reach-news-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS SwiftUI Simulator Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and test
        run: |
          xcodebuild build-for-testing -project ReachNews.xcodeproj -scheme ReachNews -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' CODE_SIGNING_ALLOWED=NO
          xcodebuild test-without-building -project ReachNews.xcodeproj -scheme ReachNews -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' CODE_SIGNING_ALLOWED=NO
      - name: Archive simulator app
        run: |
          xcodebuild build -project ReachNews.xcodeproj -scheme ReachNews -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/ReachNews.app ReachNews-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: reach-news-ios-simulator
          path: ReachNews-iOS-Simulator.zip


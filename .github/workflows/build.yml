name: Build Reach News

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android Compose APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle wrapper --gradle-version 8.11.1
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reach-news-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS SwiftUI Device IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive device app
        run: |
          xcodebuild archive -project ReachNews.xcodeproj -scheme ReachNews -destination 'generic/platform=iOS' -archivePath build/ReachNews.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p build/Payload
          cp -R build/ReachNews.xcarchive/Products/Applications/ReachNews.app build/Payload/ReachNews.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/Payload ReachNews.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: reach-news-ios-ipa
          path: ReachNews.ipa

  ios-visual-preview:
    name: iOS Visual Preview
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build simulator app
        run: xcodebuild build -project ReachNews.xcodeproj -scheme ReachNews -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Boot simulator and capture preview
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "$DEVICE_ID" ]; then echo "No available iPhone simulator"; exit 1; fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/ReachNews.app
          xcrun simctl launch "$DEVICE_ID" com.tangsong404.reachnews
          sleep 5
          mkdir -p visual-preview
          xcrun simctl io "$DEVICE_ID" screenshot visual-preview/reach-news-briefing.png
      - uses: actions/upload-artifact@v4
        with:
          name: reach-news-ios-visual-preview
          path: visual-preview/reach-news-briefing.png


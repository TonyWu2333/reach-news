assed"},{"name":"channel-api-audit","note":"静态核对 Channel 模型字段顺序与 ChannelDTO.toDomain() 实参顺序一致；ChannelListView/ChannelEditView/ChannelCreateSheet/SubscribedChannelDetail 引用的 ChannelStore 成员全部存在；Channel 派生属性被视图引用的成员全部存在。","result":"passed"},{"name":"ios-unit-tests","note":"本机为 Linux，无 swift/xcodebuild 工具链（which swift、which xcodebuild 均不存在），无法执行 xcodegen generate 与 xcodebuild test。证据须由 GitHub Actions 的 iOS 任务提供，此处如实记为未运行。","result":"not-run"},{"name":"android-assembleDebug","note":"本机无 Android/Gradle 工具链，且本轮未改动 android/**（git status 无该目录条目）。CI 的 assembleDebug 结果须以 CI 为准。","result":"not-run"}],"knownLimits":["本机没有 Swift/Xcode 工具链，未能执行 xcodegen generate 与 xcodebuild test；编译与测试结论只能由 CI 的 iOS 任务给出，当前尚无该证据。","未对生产环境消费端做真机/模拟器实测；订阅、改色、fork、取消订阅四条动作只有固定响应替身的单元测试覆盖。","订阅预览色在「发现更多」列表按 channelId 稳定色显示，实际订阅时用的是当前建议色，两者可能不同（订阅成功后即以服务端返回色为准）。"],"requireIndependentReview":false,"summary":"iOS 客户端从「预设模板 + 实例化」迁到「频道公开 + 订阅 + fork」：ChannelKind 收敛为 channel/follow、新增 ChannelOwner 与 canEdit/canSubscribe/canUnsubscribe；Channel 增加 published/owner/subscribed/subscriptionColor/subscriptionID 并删除 ChannelPreset；Endpoint 移除 presets/instantiatePreset，新增 discover 列表、POST/PATCH/DELETE subscribe 与 fork；ChannelStore 拆成我的/订阅的/可发现三段并实现订阅、改色、取消订阅、fork 四个动作；频道页改为三段式单页（发现更多默认折叠、失败提示不随折叠隐藏）；新增订阅频道只读详情页（改色/fork/取消订阅）；删除 PresetPicker；订阅色复用 12 色板并用色值字符串承载，空字符串与未命中按未设置回退；补齐 presets_removed/not_published/own_channel/subscriber_read_only 四个错误码与中英键集（各 200 条对齐）。"}},"shape.confirm":{"sequence":2,"value":{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"client-preset-subscriptions","task":"/comet /var/lib/dsh/reach-news/docs/api-changes-preset-subscriptions.md 看这份文档，预设改为订阅对应的前端变化是我们这次修改的主题"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"频道 DTO 解码后带有 `published`、`owner`、`subscribed`、`subscriptionColor`、`subscriptionId` 五个字段；缺少时分别回退为 `false`、`creator`、`false`、`null`、`null`，不崩溃。"},{"id":"A2","source":"brief.md","text":"`owner == \"subscriber\"` 的频道 `canEdit` 为
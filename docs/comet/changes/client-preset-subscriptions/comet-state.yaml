acceptance:
  - id: A1
    source: brief.md
    text: 频道 DTO 解码后带有
      `published`、`owner`、`subscribed`、`subscriptionColor`、`subscriptionId`
      五个字段；缺少时分别回退为 `false`、`creator`、`false`、`null`、`null`，不崩溃。
    result: passed
    reason:
      text: ReachNews/Data/DTO/DTOs.swift:120-139：ChannelDTO 解码
        published/owner/subscribed/subscriptionColor/subscriptionId，toDomain 回退为
        false/creator/false/原值/原值；测试
        testChannelDTOFallsBackWhenSubscriptionFieldsMissing 覆盖缺字段。
      truncated: false
  - id: A2
    source: brief.md
    text: '`owner == "subscriber"` 的频道 `canEdit` 为 false；`published` 且非自己创建且未订阅时
      `canSubscribe` 为 true；`subscribed` 为 true 时 `canUnsubscribe` 为 true。'
    result: passed
    reason:
      text: ReachNews/Domain/Models.swift
        可写性段：canEdit=owner.isCreator、canSubscribe=published && !owner.isCreator
        && !subscribed、canUnsubscribe=subscribed；测试
        testChannelEditabilityFollowsOwnerNotKind 覆盖四种组合。
      truncated: false
  - id: A3
    source: brief.md
    text: 客户端不再请求 `/api/v1/presets` 与 `/api/v1/presets/:id/instantiate`；`Endpoint`
      中不存在这两个路径。
    result: passed
    reason:
      text: grep 全仓无 api/v1/presets；Endpoint 枚举只含
        subscribe(channelID:)/fork(channelID:)，无
        presets/instantiatePreset；api/v1/presets 路径已消失。
      truncated: false
  - id: A4
    source: brief.md
    text: '`ChannelKind` 只有 `channel` 与 `follow`；解析 `"preset"` 与未知字符串都得到
      `.channel`，列表不再按 `preset` 过滤。'
    result: passed
    reason:
      text: ReachNews/Domain/Enums.swift:8-21：ChannelKind 只有
        channel/follow，init(apiValue:) 对 preset 与未知值均回落 .channel；测试
        testChannelKindParsing 断言二者均得 .channel 且 allCases.count==2。
      truncated: false
  - id: A5
    source: brief.md
    text: 频道列表调用 `GET /api/v1/channels`（默认列表），并按 `owner` 分出「我的频道」与「订阅的频道」两段。
    result: passed
    reason:
      text: ChannelListView 分别渲染 myChannels 与 subscribedChannels 两段（sectionHeader
        channel.section.mine / channel.section.subscribed）；ChannelStore.apply 按
        owner.isCreator 与 isSubscription 分流；测试 testLoadSplitsChannelsByOwner。
      truncated: false
  - id: A6
    source: brief.md
    text: 列表另有「发现更多」段，数据来自 `GET /api/v1/channels?discover=1`，只列出 `subscribed ==
      false` 且 `owner != "creator"` 的项。
    result: passed
    reason:
      text: ChannelStore.fetchAll(discover:true) 只在发现段使用，结果经 canSubscribe 过滤（published
        && !creator && !subscribed）；测试 testDiscoverListSendsDiscoverFlag 断言
        query 带 discover=1，testDefaultListOmitsDiscoverFlag 断言默认列表不带。
      truncated: false
  - id: A7
    source: brief.md
    text: 点「订阅」调用 `POST
      /api/v1/channels/:id/subscribe`，请求体带当前选择颜色；成功后该频道出现在「订阅的频道」，并从「发现更多」移除。
    result: passed
    reason:
      text: APIClient.subscribe 发 POST /api/v1/channels/:id/subscribe，body 仅
        {color}；测试 testSubscribeSendsPaletteColorValue 断言 body 键为 [color]
        且值为色板色值，testSubscribeMovesChannelToSubscribedSegment 断言从 discover 移入订阅段。
      truncated: false
  - id: A8
    source: brief.md
    text: 重复订阅按幂等处理：`200` 与 `201` 都视为成功，不出现重复卡片。
    result: passed
    reason:
      text: 订阅成功不区分 200/201：send() 只判断 2xx；测试
        testRepeatedSubscribeIsIdempotentForClient（200）与
        testSubscribeMovesChannelToSubscribedSegment（201）各覆盖一次，重复订阅后订阅段仅一条。
      truncated: false
  - id: A9
    source: brief.md
    text: 订阅频道卡片显示订阅色点与只读标记，不显示 `enabled` 开关、编辑与删除入口。
    result: passed
    reason:
      text: SubscribedChannelCard 不含 ChannelToggle、删除与编辑入口（grep 计数为 0），显示订阅色点与
        channel.kind.subscribed 徽标；点击进入只读详情而非编辑页。
      truncated: false
  - id: A10
    source: brief.md
    text: 点击订阅频道进入只读详情；该页只提供改颜色、fork、取消订阅三项动作。
    result: passed
    reason:
      text: 新增
        SubscribedChannelDetail：只读展示方向/口吻/时间表/连接器，底部仅改颜色、fork、取消订阅三个动作，无保存/删除/运行入口；测试与规格逐条对应。
      truncated: false
  - id: A11
    source: brief.md
    text: 改订阅颜色调用 `PATCH /api/v1/channels/:id/subscribe`，只提交 `color`；成功后列表与详情立即使用新颜色。
    result: passed
    reason:
      text: APIClient.updateSubscriptionColor 用 PATCH
        /api/v1/channels/:id/subscribe，body 仅 {color}；测试
        testUpdateSubscriptionColorPatchesOnlyColor 断言方法/路径/body
        键，testUpdateSubscriptionColorUsesPatchAndRefreshesChannel 断言列表立即换色。
      truncated: false
  - id: A12
    source: brief.md
    text: 取消订阅调用 `DELETE
      /api/v1/channels/:id/subscribe`；成功后该频道从「订阅的频道」消失，其日报也不再出现在日报流与筛选中。
    result: passed
    reason:
      text: APIClient.unsubscribe 用 DELETE
        /api/v1/channels/:id/subscribe；ChannelStore.unsubscribe 立即从
        subscribedChannels 移除并重取 discover，未订阅 404 按已取消处理；ChannelListView 的
        onUnsubscribed 调 env.feed.forgetChannel 清掉本地日报流与筛选选中项；测试
        testUnsubscribeRemovesChannelAndReloadsDiscoverable、testUnsubscribeTreatsNotFoundAsAlreadyRemoved、testForgetChannelClearsBriefsAndFilter。
      truncated: false
  - id: A13
    source: brief.md
    text: fork 调用 `POST /api/v1/channels/:id/fork`；成功后新频道以 `owner ==
      "creator"`、`published == false` 出现在「我的频道」，原订阅消失。
    result: passed
    reason:
      text: APIClient.forkChannel 发 POST /api/v1/channels/:id/fork；ChannelStore.fork
        移除原订阅并把我创建的频道插入 myChannels 首位；界面二次确认后按原名 fork 再进编辑页；测试
        testForkAddsOwnChannelAndDropsSubscription 断言
        owner.isCreator、published==false、原订阅消失，testForkSendsForkMethodAndPath
        断言方法/路径。
      truncated: false
  - id: A14
    source: brief.md
    text: 订阅自己创建的频道返回 `409 own_channel`；订阅未公开频道返回 `403
      not_published`。两者都以归一化文案提示，不崩溃、不产生幽灵条目。
    result: passed
    reason:
      text: ErrorEnvelope.normalized 把 own_channel 映射为
        .ownChannel(message)、not_published 映射为
        .notPublished(message)；ChannelStore.subscribe 失败只设 discoverError
        且不插入任何条目；测试 testSubscribeOwnChannelSurfacesOwnChannelError 与
        testSubscribeUnpublishedChannelSurfacesNotPublishedError 断言错误值与列表未被污染。
      truncated: false
  - id: A15
    source: brief.md
    text: 订阅者对频道调用 `PATCH` / 触发运行返回的 `403 subscriber_read_only` 被归一化为「订阅频道只读，可 fork

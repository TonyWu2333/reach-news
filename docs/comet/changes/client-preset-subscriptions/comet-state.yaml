nabled` 开关、编辑与删除入口。"},{"id":"A10","reason":{"text":"新增 SubscribedChannelDetail：只读展示方向/口吻/时间表/连接器，底部仅改颜色、fork、取消订阅三个动作，无保存/删除/运行入口；测试与规格逐条对应。","truncated":false},"result":"passed","source":"brief.md","text":"点击订阅频道进入只读详情；该页只提供改颜色、fork、取消订阅三项动作。"},{"id":"A11","reason":{"text":"APIClient.updateSubscriptionColor 用 PATCH /api/v1/channels/:id/subscribe，body 仅 {color}；测试 testUpdateSubscriptionColorPatchesOnlyColor 断言方法/路径/body 键，testUpdateSubscriptionColorUsesPatchAndRefreshesChannel 断言列表立即换色。","truncated":false},"result":"passed","source":"brief.md","text":"改订阅颜色调用 `PATCH /api/v1/channels/:id/subscribe`，只提交 `color`；成功后列表与详情立即使用新颜色。"},{"id":"A12","reason":{"text":"APIClient.unsubscribe 用 DELETE /api/v1/channels/:id/subscribe；ChannelStore.unsubscribe 立即从 subscribedChannels 移除并重取 discover，未订阅 404 按已取消处理；ChannelListView 的 onUnsubscribed 调 env.feed.forgetChannel 清掉本地日报流与筛选选中项；测试 testUnsubscribeRemovesChannelAndReloadsDiscoverable、testUnsubscribeTreatsNotFoundAsAlreadyRemoved、testForgetChannelClearsBriefsAndFilter。","truncated":false},"result":"passed","source":"brief.md","text":"取消订阅调用 `DELETE /api/v1/channels/:id/subscribe`；成功后该频道从「订阅的频道」消失，其日报也不再出现在日报流与筛选中。"},{"id":"A13","reason":{"text":"APIClient.forkChannel 发 POST /api/v1/channels/:id/fork；ChannelStore.fork 移除原订阅并把我创建的频道插入 myChannels 首位；界面二次确认后按原名 fork 再进编辑页；测试 testForkAddsOwnChannelAndDropsSubscription 断言 owner.isCreator、published==false、原订阅消失，testForkSendsForkMethodAndPath 断言方法/路径。","truncated":false},"result":"passed","source":"brief.md","text":"fork 调用 `POST /api/v1/channels/:id/fork`；成功后新频道以 `owner == \"creator\"`、`published == false` 出现在「我的频道」，原订阅消失。"},{"id":"A14","reason":{"text":"ErrorEnvelope.normalized 把 own_channel 映射为 .ownChannel(message)、not_published 映射为 .notPublished(message)；ChannelStore.subscribe 失败只设 discoverError 且不插入任何条目；测试 testSubscribeOwnChannelSurfacesOwnChannelError 与 testSubscribeUnpublishedChannelSurfacesNotPublishedError 断言错误值与列表未被污染。","truncated":false},"result":"passed","source":"brief.md","text":"订阅自己创建的频道返回 `409 own_channel`；订阅未公开频道返回 `403 not_published`。两者都以归一化文案提示，不崩溃、不产生幽灵条目。"},{"id":"A15","reason":{"text":"subscriber_read_only 映射为 .subscriberReadOnly，messageKey 为「订阅频道只读，可 fork 后修改」；订阅卡与只读详情均不渲染 PATCH/运行/删除入口，故界面不会先给出必然失败的按钮。","truncated":false},"result":"passed","source":"brief.md","text":"订阅者对频道调用 `PATCH` / 触发运行返回的 `403 subscriber_read_only` 被归一化为「订阅频道只读，可 fork 后修改」，界面不会先提供必然失败的按钮。"},{"id":"A16","reason":{"text":"APIErrorCode 新增 presetsRemoved 并映射为 APIError.removed，messageKey 为 error.presetsRemoved（「旧接口已停用」），与 .notFound 是不同的 case；测试 testSubscriptionErrorCodesAreDistinct 显式断言 presets_removed != not_found，testEnvelopeMapsNewCodesToAPIError 覆盖四种新码。","truncated":false},"result":"passed","source":"brief.md","text":"遗留调用命中已下线端点时的 `404 presets_removed` 归一化为「旧接口已停用」，与普通 `not_found` 区分。"},{"id":"A17","reason":{"text":"Channel.effectiveSubscriptionColor 把空串/纯空白视为 nil；ChannelColorStore.displayIndex 依次取服务端订阅色→本地色板→按 id 稳定色；测试 testSubscriptionColorIgnoresEmptyString、testDisplayIndexFallsBackWhenSubscriptionColorMissing、testPaletteHexValuesMatchColorOrder 覆盖。","truncated":false},"result":"passed","source":"brief.md","text":"订阅色为空字符串时按「未设置」处理：显示本地色板颜色（或按 `channelId` 稳定回退色），不显示空色点。"},{"id":"A18","reason":{"text":"Channel.canEdit 只看 owner，与 published 无关；三段列表把我的频道全部列入并保留开关与编辑入口，界面无 published 开关；测试 testPrivateOwnChannelRemainsEditable 断言 published==false 时 canEdit 为 true 且仍可查到该频道。","truncated":false},"result":"passed","source":"brief.md","text":"「我的频道」内 `published == false` 的频道正常显示并可以编辑；界面不提供公开开关。"},{"id":"A19","reason":{"text":"ChannelListView 工具栏 + 直接打开新建页，菜单中的「从模板新建」已随 PresetPicker 删除；grep 全仓无 fromPreset/PresetPicker 残留；ChannelStore.create 成功后 replace(created) 即以 creator 身份进入我的频道；UI 测试改为断言进入新建页。","truncated":false},"result":"passed","source":"brief.md","text":"新建频道成功后进入「我的频道」；创建流程不再出现「从模板新建」入口。"},{"id":"A20","reason":{"text":"频道、日报都按 channelId 关联；BriefFeedStore.loadAllChannels 取消了 kind 过滤，订阅频道与其日报按原 channelId 进入 channelsByID 与筛选列表；日报详情与列表均使用 brief.channelID。","tr